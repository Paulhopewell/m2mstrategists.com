# Publish only the public site. The build copies pages, CSS, JS and images
# into site/. Notes, changelogs, the article template and this functions
# folder are left out of that copy, so they are not served as website files.
# Functions are deployed from the directory below, which is outside site/.
# Netlify's own guidance is to keep the functions directory out of publish
# so the source is not deployed as part of the site. Form detection still
# sees the copied HTML, which keeps data-netlify="true" on the three forms.
[build]
  command = "bash scripts/publish-site.sh"
  publish = "site"

[functions]
  directory = "netlify/functions"

# Articles is parked until it has real content (branch: articles-parked).
# Temporary redirect so old links land on the homepage instead of a 404.
[[redirects]]
  from = "/articles.html"
  to = "/"
  status = 302

# SOCIAL-SHORT-LINKS
# Permanent short links for every LinkedIn and X post. Never delete these
# rules. On 1 December 2026, repoint the four `to` lines off the free-audit
# campaign. Leave the status at 302, so a later change is not stuck in a
# browser cache. A proposed standing target is in the README. That proposal
# is not live; these four rules are the destinations until the repoint.
#
# These four `to` lines are the only copy of the destination URLs. The edge
# function netlify/edge-functions/social-short-links.js counts the visit in
# Netlify Blobs, then returns without a response so these rules send the 302.
# Do not copy the destinations into that function. If the counter throws, its
# onError setting is bypass and these rules still run. They are the fallback.
#
# Netlify reads these rules from this file at the repository root. They are
# not copied into site/. scripts/publish-site.sh only publishes website files.
#
# /li and /x are not pages. The trailing-slash rules are separate paths.
# No hostname is set, so the apex and www both use them once a request
# reaches this site. www already 301s to the apex before that; that hop is
# the Netlify primary-domain setting, and it keeps the path.
[[redirects]]
  from = "/li"
  to = "/ai-growth-audit.html?utm_source=linkedin&utm_medium=social&utm_campaign=free-audit-nov&utm_content=li"
  status = 302
  force = true

[[redirects]]
  from = "/li/"
  to = "/ai-growth-audit.html?utm_source=linkedin&utm_medium=social&utm_campaign=free-audit-nov&utm_content=li"
  status = 302
  force = true

[[redirects]]
  from = "/x"
  to = "/ai-growth-audit.html?utm_source=x&utm_medium=social&utm_campaign=free-audit-nov&utm_content=x"
  status = 302
  force = true

[[redirects]]
  from = "/x/"
  to = "/ai-growth-audit.html?utm_source=x&utm_medium=social&utm_campaign=free-audit-nov&utm_content=x"
  status = 302
  force = true
# end SOCIAL-SHORT-LINKS
